<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Smart Creator - Agenda Creator Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=9">
  <style>
    .ia-creator { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .ia-creator h1 { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .ia-creator .subtitle { text-align: center; color: #888; margin-bottom: 40px; font-size: 0.95rem; }

    .upload-zone {
      border: 2px dashed #ccc; border-radius: 16px; padding: 60px 20px;
      text-align: center; cursor: pointer; transition: all 0.3s; background: #fafafa;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: #4A90D9; background: #f0f6ff; }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone .icon { font-size: 3rem; margin-bottom: 12px; }
    .upload-zone p { color: #666; margin: 4px 0; }
    .upload-zone .hint { font-size: 0.8rem; color: #aaa; }
    .upload-zone .browse { color: #4A90D9; font-weight: 600; text-decoration: underline; }

    .preview-container { display: none; margin-top: 24px; text-align: center; }
    .preview-container img {
      max-width: 100%; max-height: 400px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .preview-container .file-info { margin-top: 8px; color: #888; font-size: 0.85rem; }

    .provider-select { margin-top: 24px; text-align: center; }
    .provider-select label { font-weight: 600; margin-right: 8px; }

    .btn-analyze {
      display: inline-block; margin-top: 20px; padding: 14px 40px;
      background: linear-gradient(135deg, #4A90D9, #7B61FF); color: #fff;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s; opacity: 0.5; pointer-events: none;
    }
    .btn-analyze.active { opacity: 1; pointer-events: all; }
    .btn-analyze:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,144,217,0.4); }

    .progress-container { display: none; margin-top: 32px; }
    .progress-bar-wrapper { background: #e8e8e8; border-radius: 20px; height: 12px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #4A90D9, #7B61FF);
      border-radius: 20px; transition: width 0.5s ease;
    }
    .progress-stage { margin-top: 12px; font-size: 0.9rem; color: #666; text-align: center; }

    .result-container { display: none; margin-top: 32px; }
    .result-card {
      background: #fff; border-radius: 16px; padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .result-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    .result-detail { margin: 8px 0; font-size: 0.9rem; color: #555; }
    .color-palette { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }

    .btn-generate {
      display: inline-block; margin-top: 16px; padding: 14px 40px;
      background: linear-gradient(135deg, #4CAF50, #2E7D32); color: #fff;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s;
    }
    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76,175,80,0.4); }

    .btn-back {
      display: inline-block; margin-top: 16px; padding: 10px 24px;
      background: #f0f0f0; color: #666; border: none; border-radius: 8px;
      font-size: 0.9rem; cursor: pointer; margin-right: 8px;
    }
    .btn-back:hover { background: #e0e0e0; }

    .error-container { display: none; margin-top: 24px; text-align: center; }
    .error-card { background: #FFF3E0; border-radius: 12px; padding: 24px; border: 1px solid #FFE0B2; }
    .error-card h3 { color: #E65100; margin-bottom: 8px; }
    .error-card p { color: #BF360C; font-size: 0.9rem; }

    .result-image-compare {
      text-align: center; margin-bottom: 20px; padding: 16px;
      background: #f8f9fa; border-radius: 12px;
    }
    .result-image-compare .compare-label { font-size: 0.8rem; color: #888; margin-bottom: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="ia-creator">
    <h1>Criador Inteligente</h1>
    <p class="subtitle">Envie uma imagem de referencia e gere sua agenda completa</p>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".png,.jpg,.jpeg">
      <div class="icon">&#128229;</div>
      <p>Arraste sua imagem aqui ou <span class="browse">clique para selecionar</span></p>
      <p class="hint">PNG ou JPG — max. 20MB</p>
    </div>

    <div class="preview-container" id="previewContainer">
      <img id="previewImage" alt="Preview">
      <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="provider-select">
      <label>Cores serao extraidas automaticamente da imagem</label>
    </div>

    <div style="text-align: center;">
      <button class="btn-analyze" id="btnAnalyze" onclick="startAnalysis()">Extrair Cores e Gerar</button>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-wrapper">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-stage" id="progressStage">Preparando...</div>
    </div>

    <div class="error-container" id="errorContainer">
      <div class="error-card">
        <h3>Erro</h3>
        <p id="errorMessage"></p>
        <button class="btn-back" onclick="resetIA()">Tentar Novamente</button>
      </div>
    </div>

    <div class="result-container" id="resultContainer">
      <div class="result-card">
        <h3>Cores Extraidas</h3>
        <div class="result-image-compare" id="resultImageCompare" style="display:none;">
          <div class="compare-label">Sua Imagem</div>
          <img id="resultOriginalImage" alt="Imagem original" style="max-width:100%;max-height:300px;border-radius:12px;">
        </div>
        <div class="result-detail" id="resultDescription"></div>
        <div class="color-palette" id="colorPalette"></div>
      </div>

      <div class="result-card">
        <h3>Configurar Agenda</h3>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
          <div>
            <label style="font-weight:600;margin-right:6px;">Formato:</label>
            <select id="formatSelect" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;">
              <option value="A5">A5 (148x210mm)</option>
              <option value="A4">A4 (210x297mm)</option>
              <option value="QUADRADO">Quadrado (150x150mm)</option>
            </select>
          </div>
          <div>
            <label style="font-weight:600;margin-right:6px;">Layout:</label>
            <select id="layoutSelect" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;">
              <option value="2dpp">2 por pagina (2DPP)</option>
              <option value="1dpp">1 por pagina (1DPP)</option>
            </select>
          </div>
          <div>
            <label style="font-weight:600;margin-right:6px;">Dias:</label>
            <select id="numPages" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;">
              <option value="7">7 dias</option>
              <option value="14">14 dias</option>
              <option value="30">30 dias</option>
              <option value="90">90 dias</option>
              <option value="365">365 dias (ano completo)</option>
            </select>
          </div>
        </div>

        <div style="text-align:center;margin-top:16px;">
          <button class="btn-back" onclick="resetIA()">Nova Imagem</button>
          <button class="btn-generate" id="btnGenerate">Gerar Agenda</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/ia.js?v=7"></script>
</body>
</html>
