<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Creator Pro - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .pwd-wrapper {
            position: relative;
        }
        .pwd-wrapper input {
            padding-right: 48px;
        }
        .pwd-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #888;
            padding: 4px;
            line-height: 1;
        }
        .pwd-toggle:hover { color: #555; }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
            cursor: pointer;
        }
        .remember-row label {
            color: #666;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 0;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            background: #fee;
            color: #c33;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
        .logo {
            text-align: center;
            margin-bottom: 24px;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">&#128197;</div>
        <h1>Agenda Creator Pro</h1>
        <p class="subtitle" id="dateDisplay"></p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="pwd-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Sua senha">
                    <button type="button" class="pwd-toggle" id="pwdToggle" title="Mostrar senha">&#128065;</button>
                </div>
            </div>
            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Lembrar minha senha</label>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
        </form>
    </div>

    <script>
        (function() {
            var meses = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
            var dias = ['domingo','segunda-feira','terca-feira','quarta-feira','quinta-feira','sexta-feira','sabado'];
            var now = new Date();
            document.getElementById('dateDisplay').textContent = dias[now.getDay()] + ', ' + now.getDate() + ' de ' + meses[now.getMonth()] + ' de ' + now.getFullYear();

            var saved = localStorage.getItem('agc_login');
            if (saved) {
                try {
                    var d = JSON.parse(saved);
                    document.getElementById('email').value = d.email || '';
                    document.getElementById('password').value = d.password || '';
                    document.getElementById('remember').checked = true;
                } catch(e) {}
            }
        })();

        document.getElementById('pwdToggle').addEventListener('click', function() {
            var inp = document.getElementById('password');
            if (inp.type === 'password') {
                inp.type = 'text';
                this.innerHTML = '&#128064;';
            } else {
                inp.type = 'password';
                this.innerHTML = '&#128065;';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('btnLogin');
            var errorMsg = document.getElementById('errorMsg');
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            errorMsg.classList.remove('show');

            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            if (document.getElementById('remember').checked) {
                localStorage.setItem('agc_login', JSON.stringify({email: email, password: password}));
            } else {
                localStorage.removeItem('agc_login');
            }

            try {
                var resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, password: password })
                });
                var data = await resp.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.message || 'E-mail ou senha incorretos';
                    errorMsg.classList.add('show');
                }
            } catch(err) {
                errorMsg.textContent = 'Erro de conexao. Tente novamente.';
                errorMsg.classList.add('show');
            }
            btn.disabled = false;
            btn.textContent = 'Entrar';
        });
    </script>
</body>
</html>
