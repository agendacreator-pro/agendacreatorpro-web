<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Creator Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=9">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Agenda Creator Pro</h1>
            <p class="subtitle" data-i18n="subtitulo">Gerador de Agendas Profissionais</p>
            <div class="header-right" style="justify-content:center;margin-top:8px;">
                <a href="/ia" class="btn-logout" style="background:linear-gradient(135deg,#4A90D9,#7B61FF);text-decoration:none;">IA Smart <span style="font-size:0.7rem;opacity:0.8;">(Beta)</span></a>
                <button class="btn-logout" style="background:#888;" onclick="openPasswordModal()">Alterar Senha</button>
                <a href="/logout" class="btn-logout" data-i18n="sair">Sair</a>
            </div>
        </div>

        <div class="card">
            <div class="field">
                <label data-i18n="ano_agenda">Ano da Agenda</label>
                <input type="number" id="ano" value="2026" min="2024" max="2030">
            </div>

            <div class="field">
                <label data-i18n="idioma">Idioma</label>
                <select id="idioma">
                    <option value="pt">&#127463;&#127479; Portugues</option>
                    <option value="en">&#127468;&#127463; English</option>
                    <option value="es">&#127466;&#127480; Espanhol</option>
                </select>
            </div>

            <div class="field">
                <label data-i18n="tipo_agenda">Tipo de Agenda</label>
                <div class="radio-group">
                    <label><input type="radio" name="tipo" value="datada" checked> <span data-i18n="agenda_datada">Agenda Datada</span></label>
                    <label><input type="radio" name="tipo" value="permanente"> <span data-i18n="agenda_permanente">Agenda Permanente</span></label>
                </div>
            </div>

            <div class="field" id="paginas-field" style="display:none;">
                <label data-i18n="qtd_paginas">Quantidade de Paginas Semanais</label>
                <input type="number" id="paginas" value="52" min="1" max="200">
            </div>

            <div class="field">
                <label data-i18n="formato">Formato</label>
                <div class="radio-group">
                    <label><input type="radio" name="formato" value="A5" checked> A5</label>
                    <label><input type="radio" name="formato" value="A4"> A4</label>
                    <label><input type="radio" name="formato" value="QUADRADO"> <span data-i18n="quadrado">Quadrado</span></label>
                </div>
            </div>

            <div class="field" id="layout-field">
                <label>Layout</label>
                <div class="radio-group">
                    <label><input type="radio" name="layout" value="1" checked> 1 DPP</label>
                    <label><input type="radio" name="layout" value="2"> 2 DPP</label>
                </div>
            </div>

            <div class="field">
                <label data-i18n="tema">Tema</label>
                <select id="tema">
                    <option value="rosa" data-i18n-opt="rosa">Rosa</option>
                    <option value="azul" data-i18n-opt="azul">Azul</option>
                    <option value="verde" data-i18n-opt="verde">Verde</option>
                    <option value="amarelo" data-i18n-opt="amarelo">Amarelo</option>
                    <option value="laranja" data-i18n-opt="laranja">Laranja</option>
                    <option value="vermelho" data-i18n-opt="vermelho">Vermelho</option>
                    <option value="lilas" data-i18n-opt="lilas">Lilas</option>
                    <option value="preto" data-i18n-opt="preto">Preto</option>
                </select>
            </div>

            <div class="field">
                <label data-i18n="estilo">Estilo</label>
                <div class="radio-group">
                    <label><input type="radio" name="estilo" value="minimalista" checked> Minimalista</label>
                    <label><input type="radio" name="estilo" value="executivo"> Executivo</label>
                    <label><input type="radio" name="estilo" value="floral"> Floral</label>
                    <label><input type="radio" name="estilo" value="kawaii"> Kawaii</label>
                </div>
            </div>

            <div class="field">
                <label>
                    <input type="checkbox" id="agendamentos"> <span data-i18n="incluir_agendamentos">Incluir agenda de compromissos (08:00-18:00)</span>
                </label>
            </div>

            <button id="btn-gerar" onclick="gerar()" data-i18n="gerar_pdf">GERAR PDF</button>
            <button id="btn-preview" onclick="preview()" style="background:#5C6BC0; margin-top:8px;" data-i18n="visualizar_previa">VISUALIZAR PREVIA</button>
            <div id="status"></div>
        </div>
    </div>

    <div id="previewModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000; background:rgba(0,0,0,0.7); align-items:center; justify-content:center;">
        <div style="background:white; border-radius:12px; max-width:90vw; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid #eee;">
                <strong data-i18n="previa_pdf">Previa do PDF</strong>
                <div>
                    <button onclick="downloadFromPreview()" style="width:auto; padding:8px 20px; font-size:0.9rem; background:#4CAF50; margin-right:8px;" data-i18n="baixar_pdf">BAIXAR PDF</button>
                    <button onclick="closePreview()" style="width:auto; padding:8px 12px; font-size:1.2rem; background:#eee; color:#333;">&times;</button>
                </div>
            </div>
            <div style="flex:1; overflow:auto; padding:10px; text-align:center;">
                <embed id="previewFrame" type="application/pdf" style="width:100%; height:80vh; min-height:500px;">
            </div>
        </div>
    </div>

    idioma: "Idioma", tipo_agenda: "Tipo de Agenda", agenda_datada: "Agenda Datada",
    agenda_permanente: "Agenda Permanente", qtd_paginas: "Quantidade de Paginas Semanais",
    formato: "Formato", quadrado: "Quadrado", tema: "Tema", estilo: "Estilo",
    incluir_agendamentos: "Incluir agenda de compromissos (08:00-18:00)",
    gerar_pdf: "GERAR PDF", visualizar_previa: "VISUALIZAR PREVIA",
    previa_pdf: "Previa do PDF", baixar_pdf: "BAIXAR PDF",
    rosa: "Rosa", azul: "Azul", verde: "Verde", amarelo: "Amarelo",
    laranja: "Laranja", vermelho: "Vermelho", lilas: "Lilas", preto: "Preto",
    ia_smart_creator: "IA Smart Creator"
},

    subtitulo: "Professional Planner Generator", sair: "Logout", ano_agenda: "Planner Year",
    idioma: "Language", tipo_agenda: "Planner Type", agenda_datada: "Dated Planner",
    agenda_permanente: "Permanent Planner", qtd_paginas: "Number of Weekly Pages",
    formato: "Format", quadrado: "Square", tema: "Theme", estilo: "Style",

    rosa: "Pink", azul: "Blue", verde: "Green", amarelo: "Yellow",

    agenda_permanente: "Agenda Permanente", qtd_paginas: "Cantidad de Paginas Semanales",
    formato: "Formato", quadrado: "Cuadrado", tema: "Tema", estilo: "Estilo",
    incluir_agendamentos: "Incluir agenda de citas (08:00-18:00)",
    gerar_pdf: "GENERAR PDF", visualizar_previa: "VISTA PREVIA",
    previa_pdf: "Vista Previa del PDF", baixar_pdf: "DESCARGAR PDF",
    rosa: "Rosa", azul: "Azul", verde: "Verde", amarelo: "Amarillo",
    laranja: "Naranja", vermelho: "Rojo", lilas: "Lila", preto: "Negro",
    ia_smart_creator: "IA Smart Creator"
}};

    <script src="{{ url_for('static', filename='js/app.js') }}?v=5"></script>

    <div id="pwdModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:32px;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
        <h2 style="text-align:center;margin-bottom:4px;">Alterar Senha</h2>
        <p style="text-align:center;color:#888;font-size:13px;margin-bottom:20px;">Altere sua senha de acesso</p>
        <div id="pwdError" style="background:#fee;color:#c33;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;"></div>
        <div id="pwdSuccess" style="background:#efe;color:#3a3;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;"></div>
        <div style="margin-bottom:16px;">
          <label style="display:block;color:#555;font-size:13px;font-weight:600;margin-bottom:4px;">Senha Atual</label>
          <input type="password" id="oldPwd" style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;" placeholder="Sua senha atual">
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;color:#555;font-size:13px;font-weight:600;margin-bottom:4px;">Nova Senha</label>
          <input type="password" id="newPwd" style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;" placeholder="Minimo 6 caracteres">
        </div>
        <div style="margin-bottom:20px;">
          <label style="display:block;color:#555;font-size:13px;font-weight:600;margin-bottom:4px;">Confirmar Nova Senha</label>
          <input type="password" id="confirmPwd" style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;" placeholder="Repita a nova senha">
        </div>
        <div style="display:flex;gap:10px;">
          <button onclick="closePasswordModal()" style="flex:1;padding:12px;background:#eee;color:#555;border:none;border-radius:8px;font-size:14px;cursor:pointer;">Cancelar</button>
          <button onclick="changePassword()" id="btnChangePwd" style="flex:1;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Salvar</button>
        </div>
      </div>
    </div>

    <script>
    function openPasswordModal() {
      document.getElementById('pwdModal').style.display = 'flex';
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
      document.getElementById('pwdError').style.display = 'none';
      document.getElementById('pwdSuccess').style.display = 'none';
    }
    function closePasswordModal() {
      document.getElementById('pwdModal').style.display = 'none';
    }
    async function changePassword() {
      var errEl = document.getElementById('pwdError');
      var okEl = document.getElementById('pwdSuccess');
      var btn = document.getElementById('btnChangePwd');
      errEl.style.display = 'none';
      okEl.style.display = 'none';
      var oldPwd = document.getElementById('oldPwd').value;
      var newPwd = document.getElementById('newPwd').value;
      var confirmPwd = document.getElementById('confirmPwd').value;
      if (!oldPwd || !newPwd || !confirmPwd) {
        errEl.textContent = 'Preencha todos os campos';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      try {
        var resp = await fetch('/api/change-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ old_password: oldPwd, new_password: newPwd, confirm: confirmPwd })
        });
        var data = await resp.json();
        if (data.success) {
          okEl.textContent = 'Senha alterada com sucesso! Use a nova senha no proximo login.';
          okEl.style.display = 'block';
          document.getElementById('oldPwd').value = '';
          document.getElementById('newPwd').value = '';
          document.getElementById('confirmPwd').value = '';
        } else {
          errEl.textContent = data.message;
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Erro de conexao';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Salvar';
    }
    document.getElementById('pwdModal').addEventListener('click', function(e) {
      if (e.target === this) closePasswordModal();
    });
    </script>
</body>
</html>
