    <style>
    .font-select-wrap { position: relative; display: inline-block; }
    .font-select-btn {
      width: 200px; padding: 10px; background: #fff; color: #333;
      border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 0; display: inline-flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .font-select-btn:hover { background: #f7f7f7; border-color: #bbb; }
    .font-caret { color: #888; font-size: 0.8rem; }
    #fontSelectLabel { flex: 1; text-align: center; }
    .font-grid {
      display: none; position: absolute; left: 50%; transform: translateX(-50%);
      top: calc(100% + 6px); width: 340px; max-width: calc(100vw - 40px);
      background: #fff; border: 1px solid #e0e0e0; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18); padding: 12px; z-index: 50;
      gap: 6px; justify-content: center; flex-wrap: wrap;
    }
    .font-chip {
      width: auto; margin: 0; padding: 9px 14px; border-radius: 8px;
      border: 2px solid #e0e0e0; background: #fff; cursor: pointer;
      font-size: 1rem; line-height: 1; transition: all 0.15s; color: #333; font-weight: 400;
    }
    .font-chip:hover { border-color: #7B61FF; }
    .font-chip.active { border-color: #4A90D9; background: #eef5ff; box-shadow: 0 2px 8px rgba(74,144,217,0.25); font-weight: 700; }
    .font-preview-box {
      margin: 12px auto 0; padding: 14px 12px; border: 2px dashed #d0d7e5; border-radius: 12px;
      background: #fafcff; font-size: 1.5rem; color: #222; min-height: 60px;
      max-width: 340px; display: flex; align-items: center; justify-content: center;
      text-align: center; transition: font-family 0.15s; overflow-wrap: anywhere;
    }

        <a href="https://pay.cakto.com.br/4rcoghn" target="_blank" rel="noopener" class="btn-meell" title="Meell Criativa - ALL INCLUSIVE">

    <div class="container">
        <div class="header-row">
            <h1>Agenda Creator Pro</h1>
            <p class="subtitle" data-i18n="subtitulo">Gerador de Agendas Profissionais</p>
            <div class="header-right" style="justify-content:center;margin-top:8px;">
                <a href="/ia" class="btn-logout" style="background:linear-gradient(135deg,#4A90D9,#7B61FF);text-decoration:none;">IA Smart <span style="font-size:0.7rem;opacity:0.8;">(Beta)</span></a>

                <a href="/logout" class="btn-logout" data-i18n="sair">Sair</a>
            </div>
        </div>

        <div class="card">
            <div class="field">
                <label data-i18n="ano_agenda">Ano da Agenda</label>
                <input type="number" id="ano" value="2026" min="2024" max="2030">
            </div>

            <div class="field">
                <label data-i18n="idioma">Idioma</label>
                <select id="idioma">
                    <option value="pt">&#127463;&#127479; Portugues</option>
                    <option value="en">&#127468;&#127463; English</option>
                    <option value="es">&#127466;&#127480; Espanhol</option>
                </select>
            </div>

            <div class="field">
                <label data-i18n="tipo_agenda">Tipo de Agenda</label>
                <div class="radio-group">
                    <label><input type="radio" name="tipo" value="datada" checked> <span data-i18n="agenda_datada">Agenda Datada</span></label>
                    <label><input type="radio" name="tipo" value="permanente"> <span data-i18n="agenda_permanente">Agenda Permanente</span></label>
                    <label><input type="radio" name="tipo" value="juridica"> <span data-i18n="agenda_juridica">Agenda Juridica</span></label>
                    <label><input type="radio" name="tipo" value="crista"> <span data-i18n="agenda_crista">Agenda Cristã</span></label>
                </div>
            </div>

            <div class="field" id="paginas-field" style="display:none;">
                <label data-i18n="qtd_paginas">Quantidade de Paginas Semanais</label>
                <input type="number" id="paginas" value="52" min="1" max="200">
            </div>

            <div class="field" id="juridica-field" style="display:none; border:1px solid #e0e0e0; border-radius:12px; padding:16px; background:#fafbfc;">
                <label style="font-weight:700; font-size:0.95rem;" data-i18n="juridica_config">Configuracoes da Agenda Juridica</label>

                <div class="field">
                    <label data-i18n="juridica_layout">Periodicidade</label>
                    <div class="radio-group">
                        <label><input type="radio" name="juridica_layout" value="diaria" checked> <span data-i18n="juridica_layout_diaria">Diaria</span></label>
                        <label><input type="radio" name="juridica_layout" value="semanal"> <span data-i18n="juridica_layout_semanal">Semanal</span></label>
                        <label><input type="radio" name="juridica_layout" value="mensal"> <span data-i18n="juridica_layout_mensal">Mensal</span></label>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="juridica_horarios">Incluir agenda de horarios (08:00-18:00)</label>
                    <input type="checkbox" id="juridica_agendamentos">
                </div>

                <div class="field">
                    <label data-i18n="juridica_maximas">Incluir maximas juridicas</label>
                    <input type="checkbox" id="juridica_maximas" checked>
                </div>

                <div class="field">
                    <label data-i18n="juridica_paginas_extras">Paginas extras incluídas</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" id="juridica_anual" checked> <span data-i18n="juridica_anual">Calendario anual</span></label>
                        <label><input type="checkbox" id="juridica_mensais" checked> <span data-i18n="juridica_mensais">Paginas mensais</span></label>
                        <label><input type="checkbox" id="juridica_semanais" checked> <span data-i18n="juridica_semanais">Paginas semanais</span></label>
                        <label><input type="checkbox" id="juridica_diarias" checked> <span data-i18n="juridica_diarias">Paginas diarias</span></label>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="juridica_secoes">Seções de registro</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" class="juridica-secao" value="clientes" checked> <span data-i18n="juridica_clientes">Clientes</span></label>
                        <label><input type="checkbox" class="juridica-secao" value="processos" checked> <span data-i18n="juridica_processos">Processos</span></label>
                        <label><input type="checkbox" class="juridica-secao" value="honorarios" checked> <span data-i18n="juridica_honorarios">Honorarios</span></label>
                        <label><input type="checkbox" class="juridica-secao" value="custas" checked> <span data-i18n="juridica_custas">Custas</span></label>
                        <label><input type="checkbox" class="juridica-secao" value="protocolos" checked> <span data-i18n="juridica_protocolos">Protocolos</span></label>
                        <label><input type="checkbox" class="juridica-secao" value="reunioes" checked> <span data-i18n="juridica_reunioes">Reunioes</span></label>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="juridica_secoes_paginas">Paginas por secao de registro</label>
                    <input type="number" id="juridica_secoes_paginas" value="2" min="0" max="20">
                </div>
            </div>

                    <label><input type="radio" name="formato" value="A4"> A4</label>
                    <label><input type="radio" name="formato" value="QUADRADO"> <span data-i18n="quadrado">Quadrado</span></label>
                </div>
            </div>

            <div class="field" id="layout-field">
                <label>Layout</label>
                <div class="radio-group">
                    <label><input type="radio" name="layout" value="1" checked> 1 DPP</label>
                    <label><input type="radio" name="layout" value="2"> 2 DPP</label>
                </div>
            </div>

            <div class="field">
                <label data-i18n="tema">Tema</label>
                <select id="tema">
                    <option value="rosa" data-i18n-opt="rosa">Rosa</option>
                    <option value="azul" data-i18n-opt="azul">Azul</option>
                    <option value="verde" data-i18n-opt="verde">Verde</option>
                    <option value="amarelo" data-i18n-opt="amarelo">Amarelo</option>
                    <option value="laranja" data-i18n-opt="laranja">Laranja</option>
                    <option value="vermelho" data-i18n-opt="vermelho">Vermelho</option>
                    <option value="lilas" data-i18n-opt="lilas">Lilas</option>
                    <option value="preto" data-i18n-opt="preto">Preto</option>
                </select>
            </div>

            <div class="field" id="estilo-field">
                <label data-i18n="estilo">Estilo</label>
                <div class="radio-group">
                    <label><input type="radio" name="estilo" value="minimalista" checked> Minimalista</label>
                    <label><input type="radio" name="estilo" value="executivo"> Executivo</label>
                    <label><input type="radio" name="estilo" value="floral"> Floral</label>
                    <label><input type="radio" name="estilo" value="kawaii"> Kawaii</label>
                </div>
            </div>

            <div class="field">
                <label data-i18n="fonte_texto">Fonte do texto</label>
                <input type="hidden" id="selFont" value="">
                <div class="font-select-wrap">
                    <button type="button" id="fontSelectBtn" class="font-select-btn" onclick="toggleFontGrid()">
                        <span id="fontSelectLabel">Padrão</span>
                        <span class="font-caret">&#9662;</span>
                    </button>
                    <div id="fontGrid" class="font-grid"></div>
                </div>
                <div id="fontPreview" class="font-preview-box">Agenda Creator Pro - Web</div>
            </div>

            <div class="field">
                <label data-i18n="incluir_agendamentos">Incluir agenda de compromissos (08:00-18:00)</label>
                <input type="checkbox" id="agendamentos">
            </div>

            <div class="field">
                <label data-i18n="encadernacao">Tipo de Encadernacao</label>
                <div class="radio-group" id="binding-group">
                    <label><input type="radio" name="binding" value="espiral" checked> <span data-i18n="espiral">Espiral</span></label>
                    <label><input type="radio" name="binding" value="copta"> <span data-i18n="copta">Copta (cadernos A4)</span></label>
                </div>
            </div>

            <button id="btn-gerar" onclick="gerar()" data-i18n="gerar_pdf">GERAR PDF</button>
            <button id="btn-preview" onclick="preview()" style="background:#5C6BC0; margin-top:8px;" data-i18n="visualizar_previa">VISUALIZAR PREVIA</button>
            <div id="status"></div>
        </div>
    </div>

    <div id="previewModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000; background:rgba(0,0,0,0.7); align-items:center; justify-content:center;">
        <div style="background:white; border-radius:12px; max-width:90vw; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid #eee;">
                <strong data-i18n="previa_pdf">Previa do PDF</strong>
                <div>
                    <button onclick="downloadFromPreview()" style="width:auto; padding:8px 20px; font-size:0.9rem; background:#4CAF50; margin-right:8px;" data-i18n="baixar_pdf">BAIXAR PDF</button>
                    <button onclick="closePreview()" style="width:auto; padding:8px 12px; font-size:1.2rem; background:#eee; color:#333;">&times;</button>
                </div>
            </div>
            <div style="flex:1; overflow:auto; padding:10px; text-align:center;">
                <embed id="previewFrame" type="application/pdf" style="width:100%; height:80vh; min-height:500px;">
            </div>
        </div>
    </div>

    <script>
    var FONT_OPTIONS = [
      { key: "", label: "Padrão", css: "Helvetica, Arial, sans-serif" },
      { key: "Montserrat", label: "Montserrat", css: "'Montserrat', sans-serif" },
      { key: "Poppins", label: "Poppins", css: "'Poppins', sans-serif" },
      { key: "Lato", label: "Lato", css: "'Lato', sans-serif" },
      { key: "OpenSans", label: "Open Sans", css: "'Open Sans', sans-serif" },
      { key: "Nunito", label: "Nunito", css: "'Nunito', sans-serif" },
      { key: "Roboto", label: "Roboto", css: "'Roboto', sans-serif" },
      { key: "Inter", label: "Inter", css: "'Inter', sans-serif" },
      { key: "Quicksand", label: "Quicksand", css: "'Quicksand', sans-serif" },
      { key: "PlayfairDisplay", label: "Playfair Display", css: "'Playfair Display', serif" },
      { key: "CormorantGaramond", label: "Cormorant Garamond", css: "'Cormorant Garamond', serif" },
      { key: "Caveat", label: "Caveat", css: "'Caveat', cursive" },
      { key: "PatrickHand", label: "Patrick Hand", css: "'Patrick Hand', cursive" },
      { key: "IndieFlower", label: "Indie Flower", css: "'Indie Flower', cursive" },
      { key: "ShadowsIntoLight", label: "Shadows Into Light", css: "'Shadows Into Light', cursive" },
      { key: "DancingScript", label: "Dancing Script", css: "'Dancing Script', cursive" },
      { key: "GreatVibes", label: "Great Vibes", css: "'Great Vibes', cursive" },
      { key: "Pacifico", label: "Pacifico", css: "'Pacifico', cursive" },
      { key: "AmaticSC", label: "Amatic SC", css: "'Amatic SC', cursive" }
    ];

    function updateFontPreview(key) {
      var box = document.getElementById("fontPreview");
      if (!box) return;
      var css = "Helvetica, Arial, sans-serif";
      for (var i = 0; i < FONT_OPTIONS.length; i++) {
        if (FONT_OPTIONS[i].key === key) css = FONT_OPTIONS[i].css;
      }
      box.style.fontFamily = css;
    }

    function toggleFontGrid() {
      var grid = document.getElementById("fontGrid");
      if (!grid) return;
      grid.style.display = (grid.style.display === "flex") ? "none" : "flex";
    }

    function closeFontGrid() {
      var grid = document.getElementById("fontGrid");
      if (grid) grid.style.display = "none";
    }

    function fontLabel(key) {
      for (var i = 0; i < FONT_OPTIONS.length; i++) {
        if (FONT_OPTIONS[i].key === key) return FONT_OPTIONS[i].label;
      }
      return FONT_OPTIONS[0].label;
    }

    function selectFont(key) {
      var sel = document.getElementById("selFont");
      if (sel) sel.value = key || "";
      var lbl = document.getElementById("fontSelectLabel");
      if (lbl) lbl.textContent = fontLabel(key);
      var chips = document.querySelectorAll(".font-chip");
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.toggle("active", chips[i].getAttribute("data-font") === key);
      }
      updateFontPreview(key);
      closeFontGrid();
    }

    function buildFontGrid() {
      var grid = document.getElementById("fontGrid");
      if (!grid) return;
      FONT_OPTIONS.forEach(function(f) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "font-chip" + (f.key === "" ? " active" : "");
        chip.setAttribute("data-font", f.key);
        chip.style.fontFamily = f.css;
        chip.textContent = f.label;
        chip.onclick = function() { selectFont(f.key); };
        grid.appendChild(chip);
      });
    }

    document.addEventListener("click", function(e) {
      var btn = document.getElementById("fontSelectBtn");
      var grid = document.getElementById("fontGrid");
      if (grid && grid.style.display === "flex" && btn && !btn.contains(e.target) &&
          !grid.contains(e.target)) {
        closeFontGrid();
      }
    });

    buildFontGrid();
    </script>

    <div id="pwdModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:32px;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
        <h2 style="text-align:center;margin-bottom:4px;">Alterar Senha</h2>
        <p style="text-align:center;color:#888;font-size:13px;margin-bottom:20px;">Altere sua senha de acesso</p>
        <div id="pwdError" style="background:#fee;color:#c33;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;"></div>
        <div id="pwdSuccess" style="background:#efe;color:#3a3;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;"></div>
        <div style="margin-bottom:16px;">
          <label style="display:block;color:#555;font-size:13px;font-weight:600;margin-bottom:4px;">Senha Atual</label>
          <input type="password" id="oldPwd" style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;" placeholder="Sua senha atual">
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;color:#555;font-size:13px;font-weight:600;margin-bottom:4px;">Nova Senha</label>
          <input type="password" id="newPwd" style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;" placeholder="Minimo 6 caracteres">
        </div>
        <div style="margin-bottom:20px;">
          <label style="display:block;color:#555;font-size:13px;font-weight:600;margin-bottom:4px;">Confirmar Nova Senha</label>
          <input type="password" id="confirmPwd" style="width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;" placeholder="Repita a nova senha">
        </div>
        <div style="display:flex;gap:10px;">
          <button onclick="closePasswordModal()" style="flex:1;padding:12px;background:#eee;color:#555;border:none;border-radius:8px;font-size:14px;cursor:pointer;">Cancelar</button>
          <button onclick="changePassword()" id="btnChangePwd" style="flex:1;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Salvar</button>
        </div>
      </div>
    </div>

    <script>
    function openPasswordModal() {
      document.getElementById('pwdModal').style.display = 'flex';
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
      document.getElementById('pwdError').style.display = 'none';
      document.getElementById('pwdSuccess').style.display = 'none';
    }
    function closePasswordModal() {
      document.getElementById('pwdModal').style.display = 'none';
    }
    async function changePassword() {
      var errEl = document.getElementById('pwdError');
      var okEl = document.getElementById('pwdSuccess');
      var btn = document.getElementById('btnChangePwd');
      errEl.style.display = 'none';
      okEl.style.display = 'none';
      var oldPwd = document.getElementById('oldPwd').value;
      var newPwd = document.getElementById('newPwd').value;
      var confirmPwd = document.getElementById('confirmPwd').value;
      if (!oldPwd || !newPwd || !confirmPwd) {
        errEl.textContent = 'Preencha todos os campos';
        errEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      try {
        var resp = await fetch('/api/change-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ old_password: oldPwd, new_password: newPwd, confirm: confirmPwd })
        });
        var data = await resp.json();
        if (data.success) {
          okEl.textContent = 'Senha alterada com sucesso! Use a nova senha no proximo login.';
          okEl.style.display = 'block';
          document.getElementById('oldPwd').value = '';
          document.getElementById('newPwd').value = '';
          document.getElementById('confirmPwd').value = '';
        } else {
          errEl.textContent = data.message;
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Erro de conexao';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Salvar';
    }
    document.getElementById('pwdModal').addEventListener('click', function(e) {
      if (e.target === this) closePasswordModal();
    });
    </script>
</body>
</html>
